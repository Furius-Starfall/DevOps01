# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: DevOps Course Pipeline
env:
  default-branch: main
  python-version: "3.10"
  LESSON: "L8"
  AWS_REGION: "us-east-1"
  TF_VERSION: 1.5.0

on: 
  push:
  workflow_dispatch:
      inputs:
        lesson:
          description: 'Select the lesson to run'
          required: true
          default: 'L8'
          type: choice
          options:
            - L7
            - L8
# inputs:
#     name:
#       type: choice
#       description: Who to greet
#       options: 
#       - monalisa
#       - cschleiden
# on:
#   push:
#     branches: [ $default-branch ]
#   pull_request:
#     branches: [ $default-branch ]
# 
permissions:
  contents: read

jobs:
  "L7":
    if: ${{ github.event.inputs.lesson == 'L7' }}

    runs-on: ubuntu-latest
    environment: secrets 
    
    # Nastavení permissions pro OIDC
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      working-directory: ./L7/terraform
      id: fmt
      run: terraform fmt -check
      continue-on-error: true
    
    - name: Terraform Init
      id: init
      working-directory: ./L7/terraform
      run: terraform init
    
    - name: Terraform Validate
      id: validate
      working-directory: ./L7/terraform
      run: terraform validate -no-color
    
    - name: Terraform Plan
      working-directory: ./L7/terraform
      id: plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -input=false
      continue-on-error: true
    
    - name: Update Pull Request
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Format and Style 🖌\`\${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`\${{ steps.init.outcome }}\`
          #### Terraform Validation 🤖\`\${{ steps.validate.outcome }}\`
          #### Terraform Plan 📖\`\${{ steps.plan.outcome }}\`
          
          <details><summary>Show Plan</summary>
          
          \`\`\`\n
          \${process.env.PLAN}
          \`\`\`
          
          </details>
          
          *Pushed by: @\${{ github.actor }}, Action: \`\${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
    
    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
    
    - name: Terraform Apply
      working-directory: ./L7/terraform
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
    
    - name: Get Load Balancer URL
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: lb_url
      working-directory: ./L7/terraform
      run: |
        LB_URL=$(terraform output -raw load_balancer_url)
        echo "url=$LB_URL" >> $GITHUB_OUTPUT
        echo "Load Balancer URL: $LB_URL"
    
    - name: Test Application
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "Waiting for ECS service to be stable..."
        sleep 60
        
        echo "Testing application availability..."
        for i in {1..10}; do
          if curl -f "${{ steps.lb_url.outputs.url }}"; then
            echo "Application is responding!"
            break
          else
            echo "Attempt $i failed, retrying in 30 seconds..."
            sleep 30
          fi
        done


  "L8":
    #if: ${{ github.event.inputs.lesson == 'L8' }}

    runs-on: ubuntu-latest
    environment: secrets
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with: 
        terraform_version: "1.11.1"      
    - name: Terraform create ecr repository
      working-directory: L8/terraform/
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}
        TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

        TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_IN_AUTOMATION: true
        TF_INPUT: false

        TF_WORKSPACE: dev
      run: |
        terraform init
        terraform plan -no-color -target=aws_ecr_repository.mynginx -out=tfplan
        terraform apply -auto-approve -no-color tfplan 
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Login to ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        username: ${{ secrets.AWS_ACCESS_KEY_ID }}
        password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}      
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        push: true
        context: L8/docker/
        tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/mynginx:${{ github.run_number }}

    - name: Terraform deploy
      working-directory: L8/terraform/
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ env.AWS_REGION }}     
        TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_IN_AUTOMATION: true
        TF_INPUT: false
        TF_WORKSPACE: dev
      run: |
        terraform init
        terraform plan -no-color -out=tfplan
        terraform apply -auto-approve -no-color tfplan
        
  "L9":
    if: ${{ github.event.inputs.lesson == 'L9' }}

    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Download and Setup JMeter
      run: |
        wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        tar -xzf apache-jmeter-5.6.3.tgz
        sudo mv apache-jmeter-5.6.3 /opt/jmeter
        sudo ln -s /opt/jmeter/bin/jmeter /usr/local/bin/jmeter
        
    - name: Run JMeter Performance Test
      env:
        TEST_URL: ${{ vars.TEST_URL || 'https://httpbin.org/get' }}
      run: |
        cd L9
        jmeter -n -t performance-test.jmx -l results.jtl -e -o reports/ -Jtest.url=$TEST_URL
        
    - name: Upload JMeter Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jmeter-results
        path: |
          lesson-9/results.jtl
          lesson-9/reports/
        
